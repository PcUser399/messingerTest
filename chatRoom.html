<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                max-height: 100vh;
                overflow: hidden;
                margin: 0px;
                padding: calc(2vh + 2vw);
                position: relative;
            }
            .msp-cont{
                height: 82.5vh;
                font-size: calc(1vh + 1vw);
                overflow-y:scroll ;
                border: 1px solid gray;
                padding: 5px;
                box-sizing: border-box;
            }
            .inp-container{
                margin-top: 3.5vh;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .enter-msg-inp{
                border-radius: 100px;
                font-size: calc(1vh + 1vw);
                padding: 1vh 2vw;
                width: 100%;
                box-sizing: border-box;
            }
            .dir{
                display: flex;
                gap: calc(0.5vh + 0.5vw);
                align-items: center;
            }
            .dir:hover .hide{
                display: block !important;
            }
            .hide{
                cursor: pointer;
                display: none;
            }
        </style>
    </head>

    <body>
        <div class="msp-cont" id="ct">
           
        </div>
        <div class="inp-container">
            <input class="enter-msg-inp" id="inp" placeholder="Enter Your Message" title="press enter to send !"  >
        </div>
        <script src="Load.js"></script>
        <script>
            let userName = localStorage.getItem("userName");
            let cnt = document.getElementById("ct");
            let inp = document.getElementById("inp");
            let msgArr ;
            let lastMsgId ;
            let intrv ; 

            Loading();

            async function Loading(){
                try{
                res = JSON.parse(await Load("get All Msgs"));
                msgArr = res.msg ;
                generateAllMsg();
                }
                catch(err){console.log(err)}
                intrv = setInterval(tick , 2500);
                

            }

            async function tick(){
                try{
                res = JSON.parse(await Load("get All Msgs"));
                msgArr = res.msg ;
                generateAllMsg();
                }
                catch(err){console.log(err)}
            }

            
            
            inp.addEventListener("keypress",(event)=>{
                if(event.key=='Enter') {addMessage(inp.value);inp.value=''}
            })



            function generateAllMsg(){
                cnt.innerHTML = "";
                for(let i = 0 ; i < msgArr.length ; i++){
                    cnt.insertAdjacentHTML("beforeend",`<div class="dir" id="c${i}">${msgArr[i]} <button class="hide" id="b${i}" onclick="deleteMsg(${i})" >Delete Msg</button></div>`);
                }
            }
            async function addMessage(msg){
                clearInterval(intrv);
                if(!msg){
                    return ;
                }
                let min = new Date().getMinutes();
                let hr = new Date().getHours();
                let m ;
                if(hr>13){
                    hr = hr-12;
                    m = "PM";
                }
                else{
                    m = "AM"
                }
                let tm = hr + ":" + min + " " + m ;
                let res = userName + " : " + msg + " // " + tm ;
                let i = msgArr.length ;
                cnt.insertAdjacentHTML("beforeend",`<div class="dir" id="c${i}">${res} <button class="hide" id="b${i}" onclick="deleteMsg(${i})" >Delete Msg</button></div>`);
                msgArr.push(res);
                lastMsgId++;
                try{
                await Load("add New Message",{Message : res});
                Loading();
                }
                catch(err){console.log(err)}

            }
            async function deleteMsg(id){
                clearInterval(intrv);
                let el = document.getElementById("b"+id);
                let el2 = document.getElementById("c"+id);
                if(el){
                    el2.remove();
                    await Load("delete Message",{id : String(id)});
                    Loading();
                }
            }

        </script>
    </body>
</html>
