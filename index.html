<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                gap: calc(0.5vh + 0.5vw);
            }
            input{
                width: calc(17.5vw + 17.5vh);
                font-size: calc(1vh + 1vw);
            }
            button{
               cursor: pointer;
            }
            

        </style>

    </head>

    <body>
        <div style="display: flex;gap: calc(0.5vh + 0.5vw);">
            <input placeholder="Please Enter Your User Name" id="inp">
            <button onclick="submit()">Submit</button>
        </div>

        <script>
            let logedIn = localStorage.getItem("userName");
            if(logedIn){
                window.location.href = "chatRoom.html";
            }
            let i = document.getElementById("inp");
            function submit(){
                if(i.value){
                    localStorage.setItem("userName" , i.value);
                    window.location.href = "chatRoom.html";
                }
                else{
                    alert("userName Obligatory !");
                }
            }
        </script>
    </body>
</html>
